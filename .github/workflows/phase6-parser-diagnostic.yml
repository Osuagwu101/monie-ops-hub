name: Phase 6 Parser Diagnostic

on:
  push:
    branches: [agent/phase6-operational-readiness]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-operational-readiness
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Print parser fixture diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase6-offline-acceptance.ts')
          text = path.read_text()
          needle = '  assert.equal(parsed.canImport, true, "Valid fixture must be importable");'
          replacement = '  console.log(JSON.stringify({summary: parsed.summary, daily: parsed.dailyRows.length, rolling: parsed.rollingRows.length, nonTransacting: parsed.nonTransactingRows.length, checks: parsed.checks}, null, 2));\n' + needle
          if needle not in text:
              raise SystemExit('diagnostic target missing')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          bun scripts/phase6-offline-acceptance.ts || true
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/phase6-parser-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase6-parser-diagnostic.yml
          git commit -m "Remove Phase 6 parser diagnostic workflow"
          git push origin HEAD:agent/phase6-operational-readiness
