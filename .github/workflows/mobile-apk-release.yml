name: Mobile APK Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install mobile dependencies
        run: npm ci
      - name: Generate Moniepoint BRM brand assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/generate_brand_assets.py
      - name: Configure shared production backend
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://maajpydeugszipsbilgh.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_EtiaAjDKKyM0jV54jpTuXQ_sdAVic5H" >> "$GITHUB_ENV"
      - name: Typecheck mobile app
        run: npm run typecheck
      - name: Generate native Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean
      - name: Build installable release APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify release APK contains packaged JavaScript
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -qE 'assets/index\.android\.bundle$|assets/[^ ]+\.bundle$'
      - name: Stage release APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/moniepoint-brm-1.0.0-internal.apk
          sha256sum dist/moniepoint-brm-1.0.0-internal.apk | tee dist/moniepoint-brm-1.0.0-internal.apk.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moniepoint-brm-android-apk
          path: |
            mobile/dist/moniepoint-brm-1.0.0-internal.apk
            mobile/dist/moniepoint-brm-1.0.0-internal.apk.sha256
          if-no-files-found: error
          retention-days: 14
