name: Mobile APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mobile/**
      - .github/workflows/mobile-apk-release.yml

permissions:
  contents: write

concurrency:
  group: android-v1.2.0-grouped-workspace
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install mobile dependencies
        run: npm ci
      - name: Generate Moniepoint BRM brand assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/generate_brand_assets.py
      - name: Configure shared production backend
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://maajpydeugszipsbilgh.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_EtiaAjDKKyM0jV54jpTuXQ_sdAVic5H" >> "$GITHUB_ENV"
      - name: Typecheck mobile app
        run: npm run typecheck
      - name: Verify retained and new mobile features
        run: |
          npm run test:phase1
          npm run test:phase2
          npm run test:phase3
          npm run test:phase4
      - name: Generate native Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean
      - name: Build installable internal APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Stage release APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk
          sha256sum dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk | tee dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moniepoint-brm-android-apk
          path: |
            mobile/dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk
            mobile/dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-v1.2.0-grouped-workspace
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk dist/monie-ops-hub-android-v1.2.0-grouped-workspace.apk.sha256 --target "$GITHUB_SHA" --title "Monie Ops Hub Android v1.2.0 — Grouped Workspace" --notes "Installable internal Android build with the selected Grouped Workspace menu, Director-only Administration, Operations Team, and Director-only BO phone/POS account editing. Source commit: $GITHUB_SHA"
          fi
