name: Amina Performance UI Wire

on:
  push:
    branches: [agent/amina-management-performance-layer]

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/amina-management-performance-layer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire performance panels
        run: |
          python - <<'PY'
          from pathlib import Path

          ai = Path('src/routes/ai-logs.tsx')
          text = ai.read_text()
          old = 'import { Alert, AlertDescription, AlertTitle } from "@/components/ui/alert";\n'
          new = 'import { AminaPerformancePanel } from "@/components/amina-performance-panel";\nimport { Alert, AlertDescription, AlertTitle } from "@/components/ui/alert";\n'
          if old not in text:
              raise SystemExit('ai-logs import target missing')
          text = text.replace(old, new, 1)

          marker = '''      {!isDirector && profile?.role === "assistant" && (\n        <Alert>\n          <UserRound className="h-4 w-4" />\n          <AlertTitle>Your support team is evidence-limited</AlertTitle>\n          <AlertDescription>\n            You see recommendations connected to your work. Raw report imports, portfolio-wide\n            source rows and Director controls remain hidden.\n          </AlertDescription>\n        </Alert>\n      )}\n\n'''
          addition = marker + '''      {effectiveAssistantId && (\n        <AminaPerformancePanel\n          assistantId={effectiveAssistantId}\n          accessToken={accessToken}\n          isDirector={isDirector}\n        />\n      )}\n\n'''
          if marker not in text:
              raise SystemExit('ai-logs panel target missing')
          text = text.replace(marker, addition, 1)
          ai.write_text(text)

          index = Path('src/routes/index.tsx')
          text = index.read_text()
          old = 'import { Badge } from "@/components/ui/badge";\n'
          new = 'import { AminaPerformancePanel } from "@/components/amina-performance-panel";\nimport { Badge } from "@/components/ui/badge";\n'
          if old not in text:
              raise SystemExit('index component import target missing')
          text = text.replace(old, new, 1)
          old = 'import { loadAssistantTasks, localDateKey } from "@/lib/assistant-data";\n'
          new = 'import { loadAssistantProfile, loadAssistantTasks, localDateKey } from "@/lib/assistant-data";\n'
          if old not in text:
              raise SystemExit('index assistant import target missing')
          text = text.replace(old, new, 1)
          old = '  const date = localDateKey();\n  const tasksQuery = useQuery({\n'
          new = '''  const date = localDateKey();\n  const accessToken = session?.access_token ?? "";\n  const profileQuery = useQuery({\n    queryKey: ["profile", user?.id],\n    queryFn: () => loadAssistantProfile(user!.id, accessToken),\n    enabled: Boolean(user?.id && accessToken),\n  });\n  const tasksQuery = useQuery({\n'''
          if old not in text:
              raise SystemExit('index query target missing')
          text = text.replace(old, new, 1)
          text = text.replace('queryFn: () => loadAssistantTasks(date, session!.access_token),', 'queryFn: () => loadAssistantTasks(date, accessToken),', 1)
          text = text.replace('queryFn: () => loadLatestPortfolioPerformance(session!.access_token),', 'queryFn: () => loadLatestPortfolioPerformance(accessToken),', 1)
          text = text.replace('<Badge variant="outline">Phase 3</Badge>', '<Badge variant="outline">Phase 4</Badge>', 1)

          metric_end = '''      </section>\n\n      <section className="grid gap-4 lg:grid-cols-[1.35fr_0.65fr]">\n'''
          replacement = '''      </section>\n\n      {profileQuery.data?.role === "assistant" && user?.id && accessToken && (\n        <AminaPerformancePanel\n          assistantId={user.id}\n          accessToken={accessToken}\n          isDirector={false}\n          compact\n        />\n      )}\n\n      <section className="grid gap-4 lg:grid-cols-[1.35fr_0.65fr]">\n'''
          if metric_end not in text:
              raise SystemExit('index panel insertion target missing')
          text = text.replace(metric_end, replacement, 1)
          index.write_text(text)
          PY
      - run: bunx prettier --write src/components/amina-performance-panel.tsx src/lib/performance-data.ts src/routes/ai-logs.tsx src/routes/index.tsx
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/amina-ui-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/amina-performance-panel.tsx src/lib/performance-data.ts src/routes/ai-logs.tsx src/routes/index.tsx .github/workflows/amina-ui-wire.yml
          git diff --cached --quiet && exit 0
          git commit -m "Wire Amina performance management into portal"
          git push origin HEAD:agent/amina-management-performance-layer
