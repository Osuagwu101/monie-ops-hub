name: Bake mobile brand assets

on:
  push:
    branches: [agent/live-mirror-15-task-production]
    paths: [.github/workflows/mobile-brand-assets-commit.yml]

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-mirror-15-task-production
      - name: Generate official Moniepoint BRM artwork
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 mobile/scripts/generate_brand_assets.py
      - name: Commit artwork and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mobile-brand-assets-commit.yml
          git add mobile/assets/icon.png mobile/assets/adaptive-icon.png mobile/assets/splash-icon.png
          git commit -m "Bake Moniepoint BRM mobile artwork"
          git push origin HEAD:agent/live-mirror-15-task-production
