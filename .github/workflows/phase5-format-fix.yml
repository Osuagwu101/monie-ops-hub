name: Phase 5 Formatting Fix

on:
  push:
    branches:
      - agent/phase5-secure-automation-hardening
    paths:
      - .github/workflows/phase5-format-fix.yml

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-secure-automation-hardening
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format Phase 5 routes
        run: bunx prettier --write src/routes/api.automation-worker.ts src/routes/automation.tsx
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Clean diagnostics and temporary workflow
        run: |
          rm -f phase5-lint.txt
          rm .github/workflows/phase5-format-fix.yml
      - name: Commit validated formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format and validate Phase 5 automation routes'
          git push
