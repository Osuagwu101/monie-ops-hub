name: Mobile brandmark patch

on:
  push:
    branches: [agent/live-mirror-15-task-production]
    paths: [.github/workflows/mobile-brandmark-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-mirror-15-task-production
      - name: Patch in-app brand mark
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()
          replacements = [
            (
              '  AppState,\n  Pressable,',
              '  AppState,\n  Image,\n  Pressable,',
            ),
            (
              '''function BrandMark({ small = false }: { small?: boolean }) {\n  return (\n    <View style={[styles.brandMark, small && styles.brandMarkSmall]}>\n      <Text style={[styles.brandMarkText, small && styles.brandMarkTextSmall]}>M</Text>\n    </View>\n  );\n}''',
              '''function BrandMark({ small = false }: { small?: boolean }) {\n  return (\n    <View style={[styles.brandMark, small && styles.brandMarkSmall]}>\n      <Image\n        source={require("./assets/icon.png")}\n        resizeMode="contain"\n        style={[styles.brandMarkImage, small && styles.brandMarkImageSmall]}\n      />\n    </View>\n  );\n}''',
            ),
            (
              '  brandMark: { width: 72, height: 72, borderRadius: 20, backgroundColor: BLUE, alignItems: "center", justifyContent: "center" },\n  brandMarkSmall: { width: 44, height: 44, borderRadius: 13 },\n  brandMarkText: { color: "#FFFFFF", fontSize: 42, fontWeight: "900", letterSpacing: -3 },\n  brandMarkTextSmall: { fontSize: 25, letterSpacing: -2 },',
              '  brandMark: { width: 112, height: 72, borderRadius: 20, backgroundColor: "#FFFFFF", borderWidth: 1, borderColor: BORDER, alignItems: "center", justifyContent: "center", padding: 5 },\n  brandMarkSmall: { width: 76, height: 48, borderRadius: 13, padding: 3 },\n  brandMarkImage: { width: "100%", height: "100%" },\n  brandMarkImageSmall: { width: "100%", height: "100%" },',
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected brand block missing: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          npx --yes prettier@3.9.0 --write mobile/App.tsx
      - name: Commit patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mobile-brandmark-patch.yml
          git add mobile/App.tsx
          git commit -m "Use Moniepoint BRM artwork in mobile interface"
          git push origin HEAD:agent/live-mirror-15-task-production
