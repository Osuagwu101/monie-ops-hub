name: Phase 5 Shared Parser Split

on:
  push:
    branches:
      - agent/phase5-secure-automation-hardening
    paths:
      - .github/workflows/phase5-parser-split.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-secure-automation-hardening
      - name: Split parser core and browser adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('src/lib/moniepoint-report-parser.ts').read_text()
          core_start = src.index('export const MONIEPOINT_PARSER_VERSION')
          browser_start = src.index('export async function parseMoniepointReport(file: File)')
          core = src[core_start:browser_start]
          extract_start = core.index('async function extractRawLines(file: File)')
          extract_end = core.index('function nextMeaningfulLine', extract_start)
          core = core[:extract_start] + core[extract_end:]
          core = core.replace('interface PdfTextItemLike {\n  str: string;\n  hasEOL?: boolean;\n}\n\n', '')
          marker = 'function isTextItem(item: unknown): item is PdfTextItemLike {'
          if marker in core:
              a = core.index(marker)
              b = core.index('function parseNumber', a)
              core = core[:a] + core[b:]
          Path('src/lib/moniepoint-report-core.ts').write_text(core.rstrip() + '\n')

          wrapper = '''import { GlobalWorkerOptions, getDocument } from "pdfjs-dist";\nimport pdfWorkerUrl from "pdfjs-dist/build/pdf.worker.min.mjs?url";\n\nimport {\n  parseMoniepointExtractedLines,\n  pushCanonicalLine,\n  type ParsedMoniepointReport,\n} from "@/lib/moniepoint-report-core";\n\nexport * from "@/lib/moniepoint-report-core";\n\nGlobalWorkerOptions.workerSrc = pdfWorkerUrl;\n\ninterface PdfTextItemLike {\n  str: string;\n  hasEOL?: boolean;\n}\n\nfunction isTextItem(item: unknown): item is PdfTextItemLike {\n  return Boolean(item && typeof item === "object" && "str" in item);\n}\n\nasync function extractRawLines(file: File) {\n  const bytes = new Uint8Array(await file.arrayBuffer());\n  const pdf = await getDocument({ data: bytes }).promise;\n  const lines: string[] = [];\n\n  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {\n    const page = await pdf.getPage(pageNumber);\n    const content = await page.getTextContent();\n    let current: string[] = [];\n\n    const flush = () => {\n      pushCanonicalLine(lines, current.join(" "));\n      current = [];\n    };\n\n    for (const rawItem of content.items) {\n      if (!isTextItem(rawItem)) continue;\n      const parts = rawItem.str.split(/\\r?\\n/);\n      parts.forEach((part, index) => {\n        if (part.trim()) current.push(part);\n        if (index < parts.length - 1) flush();\n      });\n      if (rawItem.hasEOL) flush();\n    }\n    flush();\n    lines.push(`__PAGE_BREAK_${pageNumber}__`);\n  }\n\n  return { lines, pageCount: pdf.numPages };\n}\n\nexport async function parseMoniepointReport(file: File): Promise<ParsedMoniepointReport> {\n  if (file.type && file.type !== "application/pdf") {\n    throw new Error("Please choose a PDF report.");\n  }\n  if (file.size > 15 * 1024 * 1024) {\n    throw new Error("The report is larger than the 15 MB import limit.");\n  }\n\n  const { lines, pageCount } = await extractRawLines(file);\n  return parseMoniepointExtractedLines(lines, pageCount);\n}\n\nexport async function sha256File(file: File) {\n  const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());\n  return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");\n}\n'''
          Path('src/lib/moniepoint-report-parser.ts').write_text(wrapper)
          PY
      - name: Format parser files
        run: npx prettier --write src/lib/moniepoint-report-core.ts src/lib/moniepoint-report-parser.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/phase5-parser-split.yml
      - name: Commit split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/moniepoint-report-core.ts src/lib/moniepoint-report-parser.ts .github/workflows/phase5-parser-split.yml
          git commit -m 'Split Moniepoint parser into shared core and browser adapter'
          git push
