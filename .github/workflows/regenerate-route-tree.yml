name: Regenerate route tree

on:
  push:
    branches: [agent/fix-moniecrm-auth-mirror]
    paths:
      - .github/workflows/regenerate-route-tree.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-moniecrm-auth-mirror
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate routes through production build
        run: bun run build
      - name: Commit generated route tree and remove helper
        run: |
          rm .github/workflows/regenerate-route-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts .github/workflows/regenerate-route-tree.yml
          git commit -m "Register hardened MonieCRM worker route"
          git push origin HEAD:agent/fix-moniecrm-auth-mirror
