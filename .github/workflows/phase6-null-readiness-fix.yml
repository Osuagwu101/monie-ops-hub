name: Phase 6 Null Readiness Fix

on:
  push:
    branches: [agent/phase6-operational-readiness]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-operational-readiness
      - name: Make manual readiness strictly boolean
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202608150913_phase6_operational_readiness.sql')
          text = path.read_text()
          old = "    and v_latest_report_status = 'processed';"
          new = "    and coalesce(v_latest_report_status = 'processed', false);"
          if text.count(old) != 1:
              raise SystemExit('Expected one manual readiness report predicate')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and remove helper
        run: |
          rm .github/workflows/phase6-null-readiness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608150913_phase6_operational_readiness.sql .github/workflows/phase6-null-readiness-fix.yml
          git commit -m "Make Phase 6 manual readiness strictly boolean"
          git push origin HEAD:agent/phase6-operational-readiness
