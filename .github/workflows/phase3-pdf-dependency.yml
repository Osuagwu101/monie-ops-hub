name: Phase 3 PDF Dependency

on:
  push:
    branches: [agent/phase-3-report-engine]

permissions:
  contents: write

jobs:
  add-pdfjs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Add PDF.js
        run: bun add pdfjs-dist

      - name: Commit dependency lock
        run: |
          if git diff --quiet; then
            echo "Dependency already locked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Add PDF.js report parser dependency"
          git push origin HEAD:agent/phase-3-report-engine
