name: Phase 5 TypeScript Integration Fix

on:
  push:
    branches:
      - agent/phase5-secure-automation-hardening
    paths:
      - .github/workflows/phase5-typescript-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-secure-automation-hardening
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fix strict TypeScript details
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/api.automation-worker.ts')
          s = p.read_text()
          s = s.replace('sessionSettings.proxyCountryCode = claim.proxyCountryCode;', 'sessionSettings["proxyCountryCode"] = claim.proxyCountryCode;')
          s = s.replace('body: new Blob([bytes], { type: "application/pdf" }),', 'body: bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength) as ArrayBuffer,')
          p.write_text(s)
          PY
      - name: Generate route tree
        run: bun run build
      - name: Validate strict TypeScript
        run: bun run typecheck
      - name: Validate lint
        run: bun run lint
      - name: Validate production build
        run: bun run build
      - name: Remove diagnostic artifacts and temporary workflow
        run: |
          rm -f phase5-typecheck.txt
          rm .github/workflows/phase5-typescript-fix.yml
      - name: Commit fixes and generated routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Phase 5 strict TypeScript integration'
          git push
