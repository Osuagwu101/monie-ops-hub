name: Amina Recalculation Hardening

on:
  push:
    branches: [agent/amina-management-performance-layer]

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/amina-management-performance-layer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Harden score refresh and bonus streak
        run: |
          python - <<'PY'
          from pathlib import Path
          old_path = Path('supabase/migrations/202608150012_amaina_management_performance.sql')
          new_path = Path('supabase/migrations/202608150012_amina_management_performance.sql')
          if not old_path.exists():
              raise SystemExit('Expected Amina migration file not found')
          text = old_path.read_text()

          target = '''  select\n    management_warning_threshold_percent,\n    penalty_trigger_percent,\n    bonus_threshold_percent,\n    bonus_streak_days,\n    bonus_percent\n  into\n    v_warning_threshold,\n    v_penalty_threshold,\n    v_bonus_threshold,\n    v_bonus_days,\n    v_bonus_percent\n  from public.operating_config\n  where id = true;\n'''
          replacement = target + '''\n  -- Recalculation must not leave a stale, unreviewed recommendation behind.\n  -- Reviewed Director decisions are never changed automatically.\n  update public.compensation_recommendations\n  set status = 'cancelled',\n      reviewed_at = now(),\n      director_note = 'Superseded by a refreshed Amina score for the same performance date.'\n  where assistant_id = p_assistant_id\n    and period_end = v_report_date\n    and status = 'pending_director'\n    and recommendation_type in ('performance_warning', 'penalty_review', 'bonus');\n'''
          if text.count(target) != 1:
              raise SystemExit('Config target not found exactly once')
          text = text.replace(target, replacement, 1)

          # Every recommendation upsert can reactivate only an automatically-cancelled row.
          old = '''    on conflict (assistant_id, recommendation_type, period_end) do update\n    set scorecard_id = excluded.scorecard_id,\n        rationale = excluded.rationale,\n        evidence = excluded.evidence,\n        updated_at = now();'''
          new = '''    on conflict (assistant_id, recommendation_type, period_end) do update\n    set scorecard_id = excluded.scorecard_id,\n        rationale = excluded.rationale,\n        evidence = excluded.evidence,\n        status = case\n          when compensation_recommendations.status = 'cancelled' then 'pending_director'\n          else compensation_recommendations.status\n        end,\n        reviewed_by = case\n          when compensation_recommendations.status = 'cancelled' then null\n          else compensation_recommendations.reviewed_by\n        end,\n        reviewed_at = case\n          when compensation_recommendations.status = 'cancelled' then null\n          else compensation_recommendations.reviewed_at\n        end,\n        director_note = case\n          when compensation_recommendations.status = 'cancelled' then null\n          else compensation_recommendations.director_note\n        end,\n        updated_at = now();'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two warning/penalty upserts, got {text.count(old)}')
          text = text.replace(old, new)

          old_bonus = '''    on conflict (assistant_id, recommendation_type, period_end) do update\n    set scorecard_id = excluded.scorecard_id,\n        recommendation_percent = excluded.recommendation_percent,\n        rationale = excluded.rationale,\n        evidence = excluded.evidence,\n        updated_at = now();'''
          new_bonus = '''    on conflict (assistant_id, recommendation_type, period_end) do update\n    set scorecard_id = excluded.scorecard_id,\n        recommendation_percent = excluded.recommendation_percent,\n        rationale = excluded.rationale,\n        evidence = excluded.evidence,\n        status = case\n          when compensation_recommendations.status = 'cancelled' then 'pending_director'\n          else compensation_recommendations.status\n        end,\n        reviewed_by = case\n          when compensation_recommendations.status = 'cancelled' then null\n          else compensation_recommendations.reviewed_by\n        end,\n        reviewed_at = case\n          when compensation_recommendations.status = 'cancelled' then null\n          else compensation_recommendations.reviewed_at\n        end,\n        director_note = case\n          when compensation_recommendations.status = 'cancelled' then null\n          else compensation_recommendations.director_note\n        end,\n        updated_at = now();'''
          if text.count(old_bonus) != 1:
              raise SystemExit('Bonus upsert target not found exactly once')
          text = text.replace(old_bonus, new_bonus, 1)

          old_streak = '''  with recent_team as (\n    select report_date, terminal_activity_rate\n    from public.portfolio_performance_snapshots\n    where report_date <= v_report_date\n    order by report_date desc\n    limit v_bonus_days\n  )\n  select\n    count(*) filter (where terminal_activity_rate >= v_bonus_threshold),\n    coalesce(max(report_date) - min(report_date), 0)\n  into v_bonus_team_days, v_bonus_span\n  from recent_team;\n\n  select count(*)\n  into v_bonus_assistant_days\n  from (\n    select score_date, individual_score_percent\n    from public.performance_scorecards\n    where subject_key = 'assistant:' || p_assistant_id::text\n      and score_date <= v_report_date\n    order by score_date desc\n    limit v_bonus_days\n  ) recent_scores\n  where individual_score_percent >= v_bonus_threshold;'''
          new_streak = '''  with latest_team_by_day as (\n    select distinct on (report_date)\n      report_date,\n      terminal_activity_rate\n    from public.portfolio_performance_snapshots\n    where report_date <= v_report_date\n    order by report_date desc, captured_at desc\n  ), recent_team as (\n    select *\n    from latest_team_by_day\n    order by report_date desc\n    limit v_bonus_days\n  ), latest_assistant_by_day as (\n    select distinct on (score_date)\n      score_date,\n      individual_score_percent\n    from public.performance_scorecards\n    where subject_key = 'assistant:' || p_assistant_id::text\n      and score_date <= v_report_date\n    order by score_date desc, updated_at desc\n  ), paired as (\n    select\n      team.report_date,\n      team.terminal_activity_rate,\n      assistant.individual_score_percent\n    from recent_team team\n    join latest_assistant_by_day assistant\n      on assistant.score_date = team.report_date\n  )\n  select\n    count(*) filter (where terminal_activity_rate >= v_bonus_threshold),\n    count(*) filter (where individual_score_percent >= v_bonus_threshold),\n    coalesce(max(report_date) - min(report_date), 0)\n  into v_bonus_team_days, v_bonus_assistant_days, v_bonus_span\n  from paired;'''
          if text.count(old_streak) != 1:
              raise SystemExit('Old bonus streak block not found exactly once')
          text = text.replace(old_streak, new_streak, 1)

          # Enforce sensible management-threshold ordering at the database layer.
          marker = '''  add column bonus_percent numeric(5,2) not null default 5\n    check (bonus_percent > 0 and bonus_percent <= 100);\n'''
          replacement = marker + '''\nalter table public.operating_config\n  add constraint operating_config_management_threshold_order\n  check (\n    critical_threshold_percent <= penalty_trigger_percent\n    and penalty_trigger_percent <= management_warning_threshold_percent\n    and management_warning_threshold_percent <= team_standard_percent\n  );\n'''
          if text.count(marker) != 1:
              raise SystemExit('Config constraint marker not found exactly once')
          text = text.replace(marker, replacement, 1)

          new_path.write_text(text)
          old_path.unlink()
          PY
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/amina-recalc-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A supabase/migrations .github/workflows/amina-recalc-hardening.yml
          git commit -m "Harden Amina recommendation recalculation"
          git push origin HEAD:agent/amina-management-performance-layer
