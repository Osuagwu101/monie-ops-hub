name: Phase 7 Mobile Scaffold

on:
  push:
    branches: [agent/phase7-mobile-notifications]

permissions:
  contents: write

jobs:
  scaffold:
    if: ${{ !contains(github.event.head_commit.message, 'Scaffold Moniepoint BRM mobile app') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-mobile-notifications
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
        continue-on-error: true
      - name: Create Expo app
        run: |
          if [ ! -d mobile ]; then
            npx create-expo-app@latest mobile --template blank-typescript --yes
          fi
      - name: Install compatible mobile dependencies
        working-directory: mobile
        run: |
          npx expo install expo-notifications expo-device expo-constants expo-linking @react-native-async-storage/async-storage
          npm install @supabase/supabase-js
      - name: Generate temporary brand and notification assets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import wave, math, struct

          assets = Path('mobile/assets')
          assets.mkdir(parents=True, exist_ok=True)
          blue = (3, 87, 238, 255)
          white = (255, 255, 255, 255)
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          icon = Image.new('RGBA', (1024, 1024), blue)
          draw = ImageDraw.Draw(icon)
          font = ImageFont.truetype(font_path, 560)
          bbox = draw.textbbox((0, 0), 'M', font=font)
          x = (1024 - (bbox[2] - bbox[0])) / 2 - bbox[0]
          y = (1024 - (bbox[3] - bbox[1])) / 2 - bbox[1] - 18
          draw.text((x, y), 'M', font=font, fill=white)
          icon.save(assets / 'icon.png')
          icon.resize((512, 512)).save(assets / 'adaptive-icon.png')
          icon.resize((512, 512)).save(assets / 'splash-icon.png')

          notif = Image.new('RGBA', (96, 96), (0, 0, 0, 0))
          nd = ImageDraw.Draw(notif)
          nfont = ImageFont.truetype(font_path, 72)
          nb = nd.textbbox((0, 0), 'M', font=nfont)
          nx = (96 - (nb[2] - nb[0])) / 2 - nb[0]
          ny = (96 - (nb[3] - nb[1])) / 2 - nb[1]
          nd.text((nx, ny), 'M', font=nfont, fill=white)
          notif.save(assets / 'notification-icon.png')

          rate = 44100
          duration = 0.34
          frequency = 880.0
          frames = int(rate * duration)
          with wave.open(str(assets / 'meeting-bing.wav'), 'w') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              for i in range(frames):
                  t = i / rate
                  envelope = min(1.0, i / (rate * 0.02)) * max(0.0, 1.0 - i / frames)
                  sample = int(32767 * 0.34 * envelope * math.sin(2 * math.pi * frequency * t))
                  wav.writeframesraw(struct.pack('<h', sample))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/phase7-mobile-scaffold.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile .github/workflows/phase7-mobile-scaffold.yml
          git commit -m "Scaffold Moniepoint BRM mobile app"
          git push origin HEAD:agent/phase7-mobile-notifications
