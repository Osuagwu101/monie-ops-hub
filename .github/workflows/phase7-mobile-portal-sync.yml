name: Phase 7 Mobile Portal Sync

on:
  push:
    branches: [agent/phase7-mobile-notifications]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-mobile-notifications
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Add shared portal snapshot to native home
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/App.tsx')
          text = path.read_text()

          targets = [
            (
              'import {\n  acknowledgeJoined,',
              'import { OperationsSnapshot } from "./src/components/OperationsSnapshot";\nimport {\n  acknowledgeJoined,'
            ),
            (
              'import { mobileCloudConfigured, supabase } from "./src/lib/supabase";',
              'import { loadOperationsSnapshot, type MobileOperationsSnapshot } from "./src/lib/operations";\nimport { mobileCloudConfigured, supabase } from "./src/lib/supabase";'
            ),
            (
              '  const [meetings, setMeetings] = useState<MeetingOccurrence[]>([]);\n',
              '  const [meetings, setMeetings] = useState<MeetingOccurrence[]>([]);\n  const [operations, setOperations] = useState<MobileOperationsSnapshot | null>(null);\n'
            ),
            (
              '          setMeetings([]);\n          return;',
              '          setMeetings([]);\n          setOperations(null);\n          return;'
            ),
            (
              '        const upcoming = await loadUpcomingMeetings();\n        setMeetings(upcoming);',
              '        const [upcoming, operationsData] = await Promise.all([\n          loadUpcomingMeetings(),\n          loadOperationsSnapshot(),\n        ]);\n        setMeetings(upcoming);\n        setOperations(operationsData);'
            ),
            (
              '        setMeetings([]);\n        setNotificationReadiness(null);',
              '        setMeetings([]);\n        setOperations(null);\n        setNotificationReadiness(null);'
            ),
            (
              '      meetings={meetings}\n      notificationReadiness={notificationReadiness}',
              '      meetings={meetings}\n      operations={operations}\n      notificationReadiness={notificationReadiness}'
            ),
            (
              '  meetings,\n  notificationReadiness,',
              '  meetings,\n  operations,\n  notificationReadiness,'
            ),
            (
              '  meetings: MeetingOccurrence[];\n  notificationReadiness: NotificationReadiness | null;',
              '  meetings: MeetingOccurrence[];\n  operations: MobileOperationsSnapshot | null;\n  notificationReadiness: NotificationReadiness | null;'
            ),
            (
              '        {error ? (\n          <View style={[styles.notice, styles.noticeError]}>',
              '        {error ? (\n          <View style={[styles.notice, styles.noticeError]}>'
            ),
          ]

          for old, new in targets:
              if old not in text:
                  raise SystemExit(f'Expected App.tsx patch target not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          anchor = '''        {error ? (
          <View style={[styles.notice, styles.noticeError]}>
            <Text style={styles.noticeTitle}>Sync needs attention</Text>
            <Text style={styles.noticeBody}>{error}</Text>
          </View>
        ) : null}

'''
          insert = '''        {error ? (
          <View style={[styles.notice, styles.noticeError]}>
            <Text style={styles.noticeTitle}>Sync needs attention</Text>
            <Text style={styles.noticeBody}>{error}</Text>
          </View>
        ) : null}

        <View style={styles.sectionHeaderRow}>
          <Text style={styles.sectionTitle}>Portal snapshot</Text>
          <Text style={styles.sectionHint}>Same live backend</Text>
        </View>
        <OperationsSnapshot data={operations} />

'''
          if anchor not in text:
              raise SystemExit('Portal snapshot insertion anchor not found')
          text = text.replace(anchor, insert, 1)
          path.write_text(text)
          PY
      - run: npm run typecheck
        working-directory: mobile
      - run: npx expo export --platform android --output-dir dist-android
        working-directory: mobile
      - run: npx expo export --platform ios --output-dir dist-ios
        working-directory: mobile
      - name: Remove helper and commit
        run: |
          rm .github/workflows/phase7-mobile-portal-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx .github/workflows/phase7-mobile-portal-sync.yml
          git commit -m "Sync portal operations into mobile home"
          git push origin HEAD:agent/phase7-mobile-notifications
