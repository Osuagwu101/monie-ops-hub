name: Phase 6 Readiness Fix

on:
  push:
    branches: [agent/phase6-operational-readiness]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-operational-readiness
      - name: Align readiness audit with production function names
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202608150913_phase6_operational_readiness.sql')
          text = path.read_text()
          old = "p.proname = 'refresh_amina_management'"
          new = "p.proname = 'refresh_amina_management_scores'"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one Amina readiness function target')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and remove helper
        run: |
          rm .github/workflows/phase6-readiness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608150913_phase6_operational_readiness.sql .github/workflows/phase6-readiness-fix.yml
          git commit -m "Align Phase 6 readiness function checks"
          git push origin HEAD:agent/phase6-operational-readiness
