name: Admin Auth Finalize

on:
  push:
    branches: [agent/admin-only-account-provisioning]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-only-account-provisioning
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate TanStack routes
        run: bun run build
      - name: Format touched files
        run: bunx prettier --write src/components/login-screen.tsx src/components/app-sidebar.tsx src/lib/cloud-api.ts src/lib/admin-users.ts src/routes/staff.tsx src/routeTree.gen.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun scripts/phase6-offline-acceptance.ts
      - run: bun run build
      - name: Remove temporary workflow and commit generated output
        run: |
          rm .github/workflows/admin-auth-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/login-screen.tsx src/components/app-sidebar.tsx src/lib/cloud-api.ts src/lib/admin-users.ts src/routes/staff.tsx src/routeTree.gen.ts .github/workflows/admin-auth-finalize.yml
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Admin-only account UI and routes"
          git push origin HEAD:agent/admin-only-account-provisioning
