name: Phase 4 Assistant UI Patch

on:
  push:
    branches: [agent/phase-4-team-orchestration]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-team-orchestration
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch Phase 4 assistant workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/daily-tasks.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  { value: "loan_interest", label: "Loan interest" },\n  { value: "escalation_required", label: "Escalation required" },',
                  '  { value: "loan_interest", label: "Loan interest" },\n  { value: "loan_disbursed", label: "Loan disbursed — confirmed success" },\n  { value: "escalation_required", label: "Escalation required" },',
              ),
              (
                  '<Badge variant="outline">Phase 2</Badge>',
                  '<Badge variant="outline">Phase 4</Badge>',
              ),
              (
                  '                  number={index + 1}\n',
                  '                  number={task.queue_rank ?? index + 1}\n',
              ),
              (
                  '          {task.rolled_from_task_id && <Badge variant="outline">Rolled over</Badge>}\n',
                  '          {task.rolled_from_task_id && <Badge variant="outline">Rolled over</Badge>}\n          {task.auto_generated && <Badge variant="outline">Amina</Badge>}\n',
              ),
              (
                  '                {outcomeOptions.map((option) => (\n                  <option key={option.value} value={option.value}>\n                    {option.label}\n                  </option>\n                ))}',
                  '                {outcomeOptions\n                  .filter(\n                    (option) => option.value !== "loan_disbursed" || task.task_type === "LOAN",\n                  )\n                  .map((option) => (\n                    <option key={option.value} value={option.value}>\n                      {option.label}\n                    </option>\n                  ))}',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected patch target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          agent_path = Path('src/routes/ai-logs.tsx')
          agent_text = agent_path.read_text()
          old = 'function AgentCard({ agent, run }: { agent: AgentKind; run?: AgentRunRecord }) {'
          new = 'function AgentCard({ agent, run }: { agent: AgentKind; run: AgentRunRecord | undefined }) {'
          if old not in agent_text:
              raise SystemExit('Expected AgentCard typing target not found')
          agent_path.write_text(agent_text.replace(old, new, 1))
          PY
      - run: bunx prettier --write src/routes/daily-tasks.tsx src/routes/ai-logs.tsx src/lib/agent-data.ts src/lib/assistant-data.ts src/components/app-sidebar.tsx
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/phase4-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/daily-tasks.tsx src/routes/ai-logs.tsx src/lib/agent-data.ts src/lib/assistant-data.ts src/components/app-sidebar.tsx .github/workflows/phase4-ui-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Polish Phase 4 assistant orchestration UI"
          git push origin HEAD:agent/phase-4-team-orchestration
