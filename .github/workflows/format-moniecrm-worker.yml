name: Format MonieCRM worker

on:
  push:
    branches: [agent/fix-moniecrm-auth-mirror]
    paths:
      - .github/workflows/format-moniecrm-worker.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-moniecrm-auth-mirror
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/api.moniecrm-worker.ts
      - name: Commit formatted worker and remove helper
        run: |
          rm .github/workflows/format-moniecrm-worker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api.moniecrm-worker.ts .github/workflows/format-moniecrm-worker.yml
          git commit -m "Format hardened MonieCRM worker"
          git push origin HEAD:agent/fix-moniecrm-auth-mirror
