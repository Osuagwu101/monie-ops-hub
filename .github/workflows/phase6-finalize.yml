name: Phase 6 Finalize

on:
  push:
    branches: [agent/phase6-operational-readiness]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-operational-readiness
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate route tree
        run: bun run build || true
      - name: Format Phase 6 files
        run: bunx prettier --write src/routes/readiness.tsx src/lib/readiness-data.ts src/components/app-sidebar.tsx scripts/phase6-offline-acceptance.ts .github/workflows/quality.yml
      - name: Offline acceptance
        run: bun scripts/phase6-offline-acceptance.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/phase6-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts src/routes/readiness.tsx src/lib/readiness-data.ts src/components/app-sidebar.tsx scripts/phase6-offline-acceptance.ts .github/workflows/quality.yml .github/workflows/phase6-finalize.yml
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Phase 6 readiness UI and acceptance gate"
          git push origin HEAD:agent/phase6-operational-readiness
