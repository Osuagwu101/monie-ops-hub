name: Live upgrade patch formatter

on:
  push:
    branches: [agent/live-mirror-15-task-production]
    paths: [.github/workflows/live-upgrade-format-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-mirror-15-task-production
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply domain-scope patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/api.automation-worker.ts')
          text = path.read_text()
          old = '''interface AutomationContext {
            runId: string;
            reportId: string | null;
            browserSessionId: string | null;
            workflowStage: string;
          }'''.replace('          ', '')
          new = '''interface AutomationContext {
            runId: string;
            reportId: string | null;
            browserSessionId: string | null;
            allowedDomains: string[];
            workflowStage: string;
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('AutomationContext block not found')
          text = text.replace(old, new, 1)
          old2 = '      sessionId: context.browserSessionId,\n      maxSteps: Math.max(100, priorityNames.length * 10 + 60),'
          new2 = '      sessionId: context.browserSessionId,\n      allowedDomains: context.allowedDomains,\n      maxSteps: Math.max(100, priorityNames.length * 10 + 60),'
          if old2 not in text:
              raise SystemExit('Enrichment task scope insertion point not found')
          path.write_text(text.replace(old2, new2, 1))
          PY
      - name: Format worker
        run: bunx prettier --write src/routes/api.automation-worker.ts
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/api.automation-worker.ts
          git commit -m "Keep Moniepoint enrichment domain scoped" || exit 0
          git push origin HEAD:agent/live-mirror-15-task-production
