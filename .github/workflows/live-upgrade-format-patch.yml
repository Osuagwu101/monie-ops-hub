name: Live upgrade patch formatter

on:
  push:
    branches: [agent/live-mirror-15-task-production]
    paths: [.github/workflows/live-upgrade-format-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-mirror-15-task-production
      - name: Apply mobile brand patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/App.tsx')
          text = path.read_text()
          old = '''  ActivityIndicator,
  Alert,
  AppState,
  Pressable,'''
          new = '''  ActivityIndicator,
  Alert,
  AppState,
  Image,
  Pressable,'''
          if old not in text:
              raise SystemExit('react-native import insertion point not found')
          text = text.replace(old, new, 1)
          old2 = '''function BrandMark({ small = false }: { small?: boolean }) {
  return (
    <View style={[styles.brandMark, small && styles.brandMarkSmall]}>
      <Text style={[styles.brandMarkText, small && styles.brandMarkTextSmall]}>M</Text>
    </View>
  );
}'''
          new2 = '''function BrandMark({ small = false }: { small?: boolean }) {
  return (
    <View style={[styles.brandMark, small && styles.brandMarkSmall]}>
      <Image
        source={require("./assets/icon.png")}
        resizeMode="contain"
        style={[styles.brandMarkImage, small && styles.brandMarkImageSmall]}
      />
    </View>
  );
}'''
          if old2 not in text:
              raise SystemExit('BrandMark block not found')
          text = text.replace(old2, new2, 1)
          old3 = '''  brandMark: { width: 72, height: 72, borderRadius: 20, backgroundColor: BLUE, alignItems: "center", justifyContent: "center" },
  brandMarkSmall: { width: 44, height: 44, borderRadius: 13 },
  brandMarkText: { color: "#FFFFFF", fontSize: 42, fontWeight: "900", letterSpacing: -3 },
  brandMarkTextSmall: { fontSize: 25, letterSpacing: -2 },'''
          new3 = '''  brandMark: { width: 112, height: 72, borderRadius: 20, backgroundColor: "#FFFFFF", borderWidth: 1, borderColor: BORDER, alignItems: "center", justifyContent: "center", padding: 5 },
  brandMarkSmall: { width: 76, height: 48, borderRadius: 13, padding: 3 },
  brandMarkImage: { width: "100%", height: "100%" },
  brandMarkImageSmall: { width: "100%", height: "100%" },'''
          if old3 not in text:
              raise SystemExit('brand styles block not found')
          path.write_text(text.replace(old3, new3, 1))
          PY
      - name: Format mobile app
        run: npx --yes prettier@3.9.0 --write mobile/App.tsx
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/App.tsx
          git commit -m "Show Moniepoint BRM mark in mobile UI" || exit 0
          git push origin HEAD:agent/live-mirror-15-task-production
