name: Mobile Quality

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - mobile/**
      - .github/workflows/mobile-quality.yml
  pull_request:
    branches:
      - main
      - phase1-mobile-human-agent-workspace
    paths:
      - mobile/**
      - .github/workflows/mobile-quality.yml

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Diagnose mobile lockfile on runner
        run: |
          pwd
          node --version
          npm --version
          ls -la
          ls -la package.json package-lock.json
          file package-lock.json
          wc -c package-lock.json
          sha256sum package.json package-lock.json
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          console.log('first100=', JSON.stringify(fs.readFileSync('package-lock.json', 'utf8').slice(0, 100)));
          console.log('lockfileVersion=', lock.lockfileVersion);
          console.log('packagesPresent=', Boolean(lock.packages));
          console.log('rootPackagePresent=', Boolean(lock.packages && lock.packages['']));
          console.log('rootPackage=', JSON.stringify(lock.packages && lock.packages['']));
          console.log('packageJsonDependencies=', JSON.stringify(pkg.dependencies || {}));
          console.log('lockfileRootDependencies=', JSON.stringify((lock.packages && lock.packages[''] && lock.packages[''].dependencies) || {}));
          for (const name of ['expo-crypto', 'expo-document-picker', 'expo-file-system', 'expo-pdf-text-extract']) {
            const entry = lock.packages && lock.packages['node_modules/' + name];
            console.log(name, entry ? JSON.stringify({version: entry.version}) : 'MISSING');
          }
          NODE
      - name: Install dependencies
        run: npm ci --loglevel verbose
      - name: Typecheck
        run: npm run typecheck
      - name: Phase 1 human-agent acceptance
        run: npm run test:phase1
      - name: Phase 2 Director operations acceptance
        run: npm run test:phase2
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios
