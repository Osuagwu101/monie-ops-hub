name: Phase 5 Typecheck Diagnostics

on:
  push:
    branches:
      - agent/phase5-secure-automation-hardening
    paths:
      - .github/workflows/phase5-typecheck-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-secure-automation-hardening
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture diagnostics
        run: bun run typecheck > phase5-typecheck.txt 2>&1 || true
      - name: Remove temporary workflow and commit diagnostics
        run: |
          rm .github/workflows/phase5-typecheck-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase5-typecheck.txt .github/workflows/phase5-typecheck-diagnostics.yml
          git commit -m 'Capture Phase 5 typecheck diagnostics'
          git push
