name: Phase 4 SQL Hotfix

on:
  push:
    branches: [agent/phase-4-team-orchestration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-team-orchestration
      - name: Fix PostgreSQL format specifier
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202608150010_phase4_team_orchestration.sql')
          text = path.read_text()
          if text.count('%.0f%% Target Met rate') != 1:
              raise SystemExit('Expected exactly one invalid PostgreSQL format specifier')
          text = text.replace('%.0f%% Target Met rate', '%s%% Target Met rate', 1)
          old = '          v_candidate.target_met_rate * 100,\n'
          new = '          round(v_candidate.target_met_rate * 100),\n'
          if old not in text:
              raise SystemExit('Expected Zainab percentage argument not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/phase4-sql-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608150010_phase4_team_orchestration.sql .github/workflows/phase4-sql-hotfix.yml
          git commit -m "Fix Zainab PostgreSQL percentage formatting"
          git push origin HEAD:agent/phase-4-team-orchestration
