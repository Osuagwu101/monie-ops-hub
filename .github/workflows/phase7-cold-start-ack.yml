name: Phase 7 Cold Start Ack

on:
  push:
    branches: [agent/phase7-mobile-notifications]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Handle cold-start meeting acknowledgement') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-mobile-notifications
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Patch notification response recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/src/lib/notifications.ts')
          text = path.read_text()
          old = '''export function listenForMeetingActions(onAcknowledge: (occurrenceId: string) => Promise<void>) {
  return Notifications.addNotificationResponseReceivedListener((response) => {
    if (response.actionIdentifier !== ACK_ACTION) return;
    const occurrenceId = response.notification.request.content.data?.["occurrenceId"];
    if (typeof occurrenceId === "string" && occurrenceId) {
      void onAcknowledge(occurrenceId);
    }
  });
}
'''
          new = '''export function listenForMeetingActions(onAcknowledge: (occurrenceId: string) => Promise<void>) {
  const handleResponse = async (response: Notifications.NotificationResponse | null) => {
    if (!response || response.actionIdentifier !== ACK_ACTION) return;
    const occurrenceId = response.notification.request.content.data?.["occurrenceId"];
    if (typeof occurrenceId === "string" && occurrenceId) {
      await onAcknowledge(occurrenceId);
      await Notifications.clearLastNotificationResponseAsync().catch(() => undefined);
    }
  };

  void Notifications.getLastNotificationResponseAsync().then(handleResponse);
  return Notifications.addNotificationResponseReceivedListener((response) => {
    void handleResponse(response);
  });
}
'''
          if old not in text:
              raise SystemExit('Expected meeting action listener not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm run typecheck
        working-directory: mobile
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/phase7-cold-start-ack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/lib/notifications.ts .github/workflows/phase7-cold-start-ack.yml
          git commit -m "Handle cold-start meeting acknowledgement"
          git push origin HEAD:agent/phase7-mobile-notifications
