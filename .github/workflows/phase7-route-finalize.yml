name: Phase 7 Route Finalize

on:
  push:
    branches: [agent/phase7-mobile-notifications]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-mobile-notifications
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate TanStack route tree
        run: bun run build
      - name: Format Phase 7 web files
        run: bunx prettier --write src/routes/meetings.tsx src/routes/api.meeting-notifications.ts src/lib/meeting-data.ts src/components/app-sidebar.tsx src/routeTree.gen.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun scripts/phase6-offline-acceptance.ts
      - run: bun run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/phase7-route-finalize.yml
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/meetings.tsx src/routes/api.meeting-notifications.ts src/lib/meeting-data.ts src/components/app-sidebar.tsx src/routeTree.gen.ts .github/workflows/phase7-route-finalize.yml
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Phase 7 web routes"
          git push origin HEAD:agent/phase7-mobile-notifications
